<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="naver-site-verification" content="32252c030114f4c157ce4dfe02801f8a3f7d9a76" />
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="naver-site-verification" content="32252c030114f4c157ce4dfe02801f8a3f7d9a76">
    <title>호빗커뮤니케이션</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f2eb;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            width: 100%;
        }
        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        nav {
            display: flex;
            gap: 25px;
            font-size: 0.9rem;
            color: #666;
            font-weight: 600;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            flex-grow: 1;
            position: relative;
        }
        .tag {
            font-size: 0.8rem;
            color: #777;
            border: 1px solid #d5d0c0;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background-color: rgba(255,255,255,0.4);
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: -1.5px;
        }
        .subtitle {
            font-size: 1.05rem;
            color: #666;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }
        .side-text {
            display: none; /* 모바일에서 겹침 방지를 위해 숨김, 큰 화면에서만 표시 */
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .float-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
        }

        /* PC 화면 스타일 */
        @media (min-width: 768px) {
            header { padding: 40px 60px; }
            .logo { font-size: 1.3rem; }
            h1 { font-size: 5rem; }
            .side-text {
                display: block;
                position: absolute;
                left: 60px;
                top: 50%;
                transform: translateY(-50%) rotate(-90deg);
                font-size: 0.75rem;
                letter-spacing: 3px;
                color: #888;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HOBBIT<br>COMMUNICATION</div>
        <nav>
            <span>ABOUT</span>
            <span>SERVICES</span>
        </nav>
    </header>

    <main class="main-container">
        <div class="side-text">YOUTUBE / MARKETING</div>
        <div class="tag">Online / Marketing</div>
        <h1>Hobbit<br>Communication</h1>
        <p class="subtitle">호빗 커뮤니케이션</p>
    </main>

    <footer>
        WHO WE ARE
    </footer>

    <!-- 카카오/오픈채팅 주소는 필요할 때 href 안에 넣어주면 돼 -->
    <a href="#" class="float-btn">
        <i class="fa-solid fa-comment"></i> 빠른 문의하기
    </a>

</body>
</html>
